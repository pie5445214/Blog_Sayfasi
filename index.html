<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Günlük</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background-color: #FDFBF7; color: #4A4A4A; }
        .pastel-shadow { box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.05); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-pink-200/30">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2" style="color: #4A4A4A;">
                <i class="fa-solid fa-leaf text-green-500"></i> Pastel Günlük
            </h1>
            <div id="header-actions" class="flex items-center gap-2">
                <button onclick="window.openAuthModal('register')" class="bg-white hover:bg-pink-50 text-gray-700 border border-pink-200 font-semibold py-2 px-4 rounded-full transition-colors text-sm cursor-pointer">
                    Kayıt Ol
                </button>
                <button onclick="window.openAuthModal('login')" class="bg-pink-200 hover:bg-pink-300 text-gray-800 font-semibold py-2 px-5 rounded-full transition-colors flex items-center gap-2 shadow-sm text-sm cursor-pointer">
                    <i class="fa-solid fa-right-to-bracket"></i> <span>Giriş Yap</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Categories -->
    <div class="max-w-3xl mx-auto px-4 py-6">
        <div class="flex overflow-x-auto hide-scrollbar space-x-3 pb-2" id="categories-container">
            <button onclick="window.filterCategory('Tümü')" class="category-btn bg-gray-800 text-amber-50 whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-colors cursor-pointer">Tümü</button>
            <button onclick="window.filterCategory('Teknoloji')" class="category-btn bg-white text-gray-700 border border-pink-200 whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-pink-50 cursor-pointer">Teknoloji</button>
            <button onclick="window.filterCategory('Yaşam')" class="category-btn bg-white text-gray-700 border border-pink-200 whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-pink-50 cursor-pointer">Yaşam</button>
            <button onclick="window.filterCategory('Sanat')" class="category-btn bg-white text-gray-700 border border-pink-200 whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-pink-50 cursor-pointer">Sanat</button>
            <button onclick="window.filterCategory('Diğer')" class="category-btn bg-white text-gray-700 border border-pink-200 whitespace-nowrap px-4 py-2 rounded-full text-sm font-medium transition-colors hover:bg-pink-50 cursor-pointer">Diğer</button>
        </div>
    </div>

    <!-- Main Content: Posts -->
    <main class="max-w-3xl mx-auto px-4">
        <div id="posts-container" class="space-y-6">
            <div class="text-center py-10 text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
                <p>Yazılar yükleniyor...</p>
            </div>
        </div>
    </main>

    <!-- Add Post Modal -->
    <div id="post-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-amber-50 w-full max-w-lg rounded-3xl p-6 relative pastel-shadow fade-in max-h-[90vh] overflow-y-auto">
            <button onclick="window.closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition-colors cursor-pointer">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h2 class="text-xl font-bold mb-5 flex items-center gap-2 text-gray-800">
                <i class="fa-solid fa-seedling text-green-500"></i> Yeni Bir Şeyler Paylaş
            </h2>
            
            <form id="blog-form" onsubmit="window.handleNewPost(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Yazı Başlığı *</label>
                    <input type="text" id="title-input" required placeholder="Çarpıcı bir başlık yaz..." class="w-full bg-white border border-pink-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Gönderi Fotoğrafı (İsteğe Bağlı)</label>
                    <input type="file" id="post-image-file" accept="image/*" class="w-full bg-white border border-pink-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-all cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">İçerik Fotoğrafları (En Fazla 4 Adet)</label>
                    <input type="file" id="post-gallery-files" accept="image/*" multiple class="w-full bg-white border border-pink-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-yellow-50 file:text-yellow-700 hover:file:bg-yellow-100 transition-all cursor-pointer">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kategori *</label>
                    <select id="category-input" class="w-full bg-white border border-pink-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-400">
                        <option value="Teknoloji">Teknoloji</option>
                        <option value="Yaşam">Yaşam</option>
                        <option value="Sanat">Sanat</option>
                        <option value="Diğer">Diğer</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">İçerik *</label>
                    <textarea id="content-input" required rows="4" placeholder="Neler düşünüyorsun?..." class="w-full bg-white border border-pink-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-400 resize-none"></textarea>
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-green-400 hover:bg-green-500 text-gray-900 font-bold py-3 rounded-xl transition-colors mt-2 shadow-sm cursor-pointer">
                    Yayınla
                </button>
            </form>
        </div>
    </div>

    <!-- Profile View Modal -->
    <div id="profile-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-amber-50 w-full max-w-sm rounded-3xl p-6 relative pastel-shadow fade-in text-center">
            <button onclick="window.closeProfile()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition-colors cursor-pointer">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <div id="profile-content"></div>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="edit-profile-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-amber-50 w-full max-w-sm rounded-3xl p-6 relative pastel-shadow fade-in">
            <button onclick="window.closeEditProfile()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition-colors cursor-pointer">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h2 class="text-xl font-bold mb-5 flex items-center gap-2 text-gray-800">
                <i class="fa-solid fa-user-astronaut text-blue-400"></i> Hesabım
            </h2>
            <form id="profile-form" onsubmit="window.saveProfile(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kullanıcı Adı *</label>
                    <input type="text" id="edit-name-input" required placeholder="Sahnede nasıl anılmak istersin?" class="w-full bg-white border border-pink-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Yeni Profil Fotoğrafı</label>
                    <input type="file" id="edit-avatar-file" accept="image/*" class="w-full bg-white border border-pink-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-pink-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition-all cursor-pointer">
                </div>
                <button type="submit" id="save-profile-btn" class="w-full bg-blue-300 hover:bg-blue-400 text-gray-900 font-bold py-3 rounded-xl transition-colors mt-2 shadow-sm cursor-pointer">
                    Kaydet
                </button>
            </form>
        </div>
    </div>

    <!-- Auth Modal (Giriş / Kayıt) -->
    <div id="auth-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-amber-50 w-full max-w-sm rounded-3xl p-6 relative pastel-shadow fade-in">
            <button onclick="window.closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition-colors cursor-pointer">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h2 id="auth-modal-title" class="text-xl font-bold mb-2 text-center text-gray-800">
                Tekrar Hoş Geldin 🌸
            </h2>
            <p id="auth-modal-subtitle" class="text-xs text-gray-500 text-center mb-5">
                Devam etmek için hesabına giriş yap
            </p>

            <form id="auth-form" onsubmit="window.handleEmailAuth(event)" class="space-y-3">
                <div id="auth-name-group" class="hidden">
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Kullanıcı Adı *</label>
                    <input type="text" id="auth-name-input" placeholder="Adın veya takma adın" class="w-full bg-white border border-pink-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">E-posta *</label>
                    <input type="email" id="auth-email-input" required placeholder="ornek@email.com" class="w-full bg-white border border-pink-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Şifre *</label>
                    <input type="password" id="auth-password-input" required minlength="6" placeholder="En az 6 karakter" class="w-full bg-white border border-pink-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-400">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-pink-300 hover:bg-pink-400 text-gray-900 font-bold py-3 rounded-xl transition-colors mt-2 shadow-sm cursor-pointer">
                    Giriş Yap
                </button>
            </form>

            <div class="relative my-4 flex items-center justify-center">
                <div class="border-t border-pink-200 w-full"></div>
                <span class="bg-amber-50 px-3 text-xs text-gray-400 font-medium">veya</span>
                <div class="border-t border-pink-200 w-full">
